language: python
dist: jammy
python:
  - "3.13"

install:
  - pip install -r "$TRAVIS_BUILD_DIR/djangotutorial/requirements.txt"
  - pip install black flake8 coverage coveralls

before_script:
  - cd "$TRAVIS_BUILD_DIR/djangotutorial" && python manage.py migrate

script:
  - cd "$TRAVIS_BUILD_DIR/djangotutorial" && black --check .
  - cd "$TRAVIS_BUILD_DIR/djangotutorial" && flake8 .
  - cd "$TRAVIS_BUILD_DIR/djangotutorial" && coverage run --source=mysite,polls manage.py test

after_success:
  - cd "$TRAVIS_BUILD_DIR/djangotutorial" && coveralls

before_deploy:
  - cd "$TRAVIS_BUILD_DIR/djangotutorial" && zip -r "$TRAVIS_BUILD_DIR/deploy.zip" . -x "*.pyc" -x "*__pycache__*" -x "*.elasticbeanstalk/*" -x "venv/*" -x ".DS_Store"

deploy:
  provider: elasticbeanstalk
  edge: true
  region: "us-east-1"
  app: "swe1-app"
  env: "tl4732-swe1"
  bucket: "elasticbeanstalk-us-east-1-521294962730"
  zip_file: "deploy.zip"
  access_key_id: "$AWS_ACCESS_KEY_ID"
  secret_access_key: "$AWS_SECRET_ACCESS_KEY"
  on:
    branch: main
